<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Концепты — Style of Mind</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f5f3;
      color: #171717;
    }
    main {
      width: min(720px, calc(100% - 40px));
      text-align: center;
    }
    h1 { margin: 0 0 12px; font-size: clamp(32px, 6vw, 56px); }
    p { margin: 0 0 32px; color: #666; }
    .concepts {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }
    a {
      display: block;
      padding: 24px;
      border: 1px solid #ddd;
      border-radius: 16px;
      background: #fff;
      color: inherit;
      text-decoration: none;
      font-size: 20px;
      transition: transform .15s ease, box-shadow .15s ease;
    }
    a:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0,0,0,.08);
    }
    @media (max-width: 520px) {
      .concepts { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Style of Mind</h1>
    <p>Выберите концепт сайта</p>
    <nav class="concepts" aria-label="Концепты">
      <a href="./concept-v0/">Концепт 0</a>
      <a href="./concept-v1/">Концепт 1</a>
      <a href="./concept-v2/">Концепт 2</a>
      <a href="./concept-v3/">Концепт 3</a>
    </nav>
  </main>
</body>
</html>
